<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Car Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#101a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light dark;--bg:#e9eef2;--card:#fff;--tx:#101a24;--mu:#5b6b7a;--ac:#0f766e;--bd:#d3dce3;--red:#c62828;--amb:#b45309;--grn:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0a1119;--card:#142030;--tx:#e6edf3;--mu:#8fa1b2;--ac:#2dd4bf;--bd:#23344a;--red:#f87171;--amb:#fbbf24;--grn:#4ade80}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.w{max-width:720px;margin:0 auto;padding:0 14px}
header{background:#101a24;color:#e9eef2;padding:calc(16px + env(safe-area-inset-top)) 0 20px}
header .w{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font-size:18px;font-weight:600}
header small{color:#8fa1b2}
#odo{font:700 34px/1 ui-monospace,"SF Mono",Consolas,monospace;color:#f5b83d;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}
#odo small{font-size:14px;margin-left:4px}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
#stats div,.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
#stats b{display:block;font-size:16px}#stats span{color:var(--mu);font-size:12px}
.c{margin:8px 0}.cl{cursor:pointer}
.r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.m{color:var(--mu);font-size:13px}
.tag{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s0{color:var(--grn)}.s1{color:var(--amb)}.s2{color:var(--red)}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.d{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:15px 0}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:#0009}
.row{display:flex;gap:8px}.row>*{flex:1}
.mt{margin-top:10px}
</style></head><body>
<header><div class="w"><div><h1 id="car"></h1><small>Odometer</small></div><div id="odo"></div></div></header>
<main class="w"><div id="stats"></div><div id="v"></div></main>
<nav><button data-t="log">Log</button><button data-t="todo">Upcoming</button><button data-t="set">Sync</button></nav>
<dialog id="dlg"><form id="f"><h2 id="ft" style="margin:0 0 12px;font-size:18px"></h2>
<label for="fi">Item</label><input id="fi" list="sg" required autocomplete="off">
<datalist id="sg"><option>Engine oil and filter<option>Air filter<option>Cabin filter<option>Spark plugs<option>Brake pads<option>Brake fluid<option>Coolant<option>Transmission fluid<option>Tyres<option>Wheel alignment<option>Battery<option>Wiper blades<option>Road tax and insurance<option>O2 sensor</datalist>
<div class="row"><div><label for="fd" id="ld">Date</label><input id="fd" type="date"></div><div><label for="fo" id="lo">Odometer (km)</label><input id="fo" type="number" inputmode="numeric" min="0"></div></div>
<div id="wc"><label for="fc">Cost (RM)</label><input id="fc" type="number" inputmode="decimal" step="0.01" min="0"></div>
<label for="fn">Notes</label><textarea id="fn" rows="2"></textarea>
<div class="row"><button type="button" class="g" onclick="$('#dlg').close()">Cancel</button><button type="button" class="d" id="fx" onclick="del()">Delete</button><button>Save</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={items:[],cfg:{car:'My Car',url:'',token:'',last:''}},tab='log',kind='log',editId=null,doneId=null,T;
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('carlog',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function load(){try{const db=await idb(),v=await new Promise(r=>{const g=db.transaction('k').objectStore('k').get('d');g.onsuccess=()=>r(g.result);g.onerror=()=>r()});if(v){D.items=v.items||[];D.cfg={...D.cfg,...v.cfg}}}catch(e){}}
async function save(){try{const db=await idb();db.transaction('k','readwrite').objectStore('k').put(D,'d')}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),
live=k=>D.items.filter(i=>i.kind===k&&!i.deleted),
today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
rm=n=>'RM '+(+n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),
km=n=>(+n).toLocaleString('en-MY')+' km',
fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'',
odoNow=()=>Math.max(0,...live('log').map(i=>+i.odo||0)),
st=t=>{const dd=t.date?(new Date(t.date+'T00:00')-new Date(today()+'T00:00'))/864e5:null,dk=t.odo?t.odo-odoNow():null;
if(dd!==null&&dd<0||dk!==null&&dk<=0)return 2;if(dd!==null&&dd<=30||dk!==null&&dk<=500)return 1;return 0},
msg=t=>{const e=$('#msg');if(e)e.textContent=t},
cf=(k,v)=>{D.cfg[k]=v;save();if(k==='car')render()};
function render(){
const c=D.cfg,L=live('log'),y=String(new Date().getFullYear()),sum=a=>a.reduce((s,i)=>s+(+i.cost||0),0);
$('#car').textContent=c.car;$('#odo').innerHTML=odoNow().toLocaleString('en-MY')+'<small>km</small>';
$('#stats').innerHTML=`<div><b>${rm(sum(L.filter(i=>(i.date||'').startsWith(y))))}</b><span>Spent in ${y}</span></div><div><b>${rm(sum(L))}</b><span>Spent overall</span></div><div><b>${L.length}</b><span>Services logged</span></div>`;
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
let h='';
if(tab==='log'){h='<button onclick="openF(\'log\')">Add service</button>'+(L.length?L.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(i=>`<div class="c cl" onclick="openF('log','${E(i.id)}')"><div class="r"><b>${E(i.item)}</b><b>${i.cost!==''?rm(i.cost):''}</b></div><div class="m">${fd(i.date)}${i.odo?' · '+km(i.odo):''}</div>${i.notes?`<div class="m">${E(i.notes)}</div>`:''}</div>`).join(''):'<p class="m">No services yet. Add your first one.</p>')}
else if(tab==='todo'){const U=live('todo').sort((a,b)=>st(b)-st(a)||(a.date||'9').localeCompare(b.date||'9'));
h='<button onclick="openF(\'todo\')">Add reminder</button>'+(U.length?U.map(i=>`<div class="c cl" onclick="openF('todo','${E(i.id)}')"><div class="r"><b>${E(i.item)}</b><span class="tag s${st(i)}">${['On track','Due soon','Overdue'][st(i)]}</span></div><div class="m">${i.date?'Due '+fd(i.date):''}${i.date&&i.odo?' · ':''}${i.odo?'at '+km(i.odo):''}</div>${i.notes?`<div class="m">${E(i.notes)}</div>`:''}<button class="g mt" onclick="event.stopPropagation();done('${E(i.id)}')">Mark done</button></div>`).join(''):'<p class="m">Nothing coming up. Add a reminder with a date, a mileage, or both.</p>')}
else h=`<div class="c"><label>Car name</label><input value="${E(c.car)}" onchange="cf('car',this.value)">
<label>Google Sheets web app URL</label><input value="${E(c.url)}" placeholder="https://script.google.com/macros/s/…/exec" onchange="cf('url',this.value.trim())">
<label>Secret token (same as in Code.gs)</label><input type="password" value="${E(c.token)}" onchange="cf('token',this.value.trim())">
<button onclick="sync(1)">Sync now</button><p class="m" id="msg">${E(c.last?'Last synced '+c.last:'Not synced yet')}</p></div>
<div class="c"><b>Backup file</b><p class="m">Save a JSON copy to iCloud Drive, Google Drive or OneDrive, or load one back in.</p>
<div class="row"><button class="g" onclick="exp()">Export JSON</button><button class="g" onclick="$('#imp').click()">Import JSON</button></div>
<input id="imp" type="file" accept=".json,application/json" hidden onchange="imp(this)"></div>`;
$('#v').innerHTML=h}
function openF(k,id,pre){kind=k;editId=id||null;doneId=pre?pre.id:null;
const it=id?D.items.find(i=>i.id===id):pre?{item:pre.item,date:today(),odo:odoNow()||'',notes:pre.notes}:k==='log'?{date:today(),odo:odoNow()||''}:{},L=k==='log';
$('#ft').textContent=(id?'Edit ':'Add ')+(L?'service':'reminder');$('#ld').textContent=L?'Date':'Due date';$('#lo').textContent=L?'Odometer (km)':'Due at (km)';
$('#wc').hidden=!L;$('#fd').required=L;$('#fx').hidden=!id;
$('#fi').value=it.item||'';$('#fd').value=it.date||'';$('#fo').value=it.odo||'';$('#fc').value=it.cost??'';$('#fn').value=it.notes||'';$('#dlg').showModal()}
const done=id=>openF('log',null,D.items.find(i=>i.id===id));
$('#f').onsubmit=e=>{e.preventDefault();const g=i=>$('#'+i).value.trim(),now=Date.now();
let it=editId&&D.items.find(i=>i.id===editId);if(!it){it={id:uid(),kind};D.items.push(it)}
Object.assign(it,{item:g('fi'),date:g('fd'),odo:g('fo')?+g('fo'):'',cost:kind==='log'&&g('fc')?+g('fc'):'',notes:g('fn'),updated:now});
if(doneId){const t=D.items.find(i=>i.id===doneId);if(t){t.deleted=1;t.updated=now}doneId=null}
$('#dlg').close();commit()};
function del(){const it=D.items.find(i=>i.id===editId);if(it&&confirm('Delete this entry?')){it.deleted=1;it.updated=Date.now();$('#dlg').close();commit()}}
function commit(){save();render();if(D.cfg.url){clearTimeout(T);T=setTimeout(sync,1500)}}
function merge(list){const m=new Map(D.items.map(i=>[i.id,i]));list.forEach(i=>{const o=m.get(i.id);if(!o||o.updated<i.updated)m.set(i.id,i)});D.items=[...m.values()]}
async function sync(manual){const c=D.cfg;if(!c.url){if(manual===1)msg('Paste your web app URL first.');return}
msg('Syncing…');try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:c.token,items:D.items})}),j=await r.json();
if(j.error)throw new Error(j.error);merge(j.items);c.last=new Date().toLocaleString('en-GB');await save();render();msg('Synced '+c.last)}
catch(e){msg('Sync failed: '+e.message+'. Your data is safe on this device.')}}
async function exp(){const b=new Blob([JSON.stringify({v:1,items:D.items},null,1)],{type:'application/json'}),f=new File([b],'car-log-'+today()+'.json',{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}
function imp(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);merge(j.items||[]);commit();alert('Imported '+(j.items||[]).length+' records.')}catch(e){alert('That file is not a Car Log backup.')}});inp.value=''}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
addEventListener('online',()=>sync());
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
load().then(()=>{render();navigator.storage&&navigator.storage.persist&&navigator.storage.persist();sync()});
</script></body></html>
