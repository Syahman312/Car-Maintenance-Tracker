<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Car Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Car Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:dark;--bg:#000;--card:#0b0b0b;--tx:#f0f0f0;--mu:#7d7d7d;--ac:#e8e8e8;--bd:#1c1c1c;--red:#f87171;--amb:#fbbf24;--grn:#4ade80}
select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 12px}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.w{max-width:720px;margin:0 auto;padding:0 14px}
header{background:#000;border-bottom:1px solid var(--bd);color:var(--tx);padding:calc(16px + env(safe-area-inset-top)) 0 20px}
header .w{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header select{background:transparent;color:var(--tx);border:0;width:auto;margin:0;font:600 18px system-ui,sans-serif;max-width:56vw;padding:0}
header select option{background:#111;color:#eee}
header small{color:var(--mu);display:block}
#odo{font:700 34px/1 ui-monospace,"SF Mono",Consolas,monospace;color:#f5b83d;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:right}
#odo small{display:inline;font-size:14px;margin-left:4px}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
#stats div,.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
#stats b{display:block;font-size:16px}#stats span{color:var(--mu);font-size:12px}
.c{margin:8px 0}.cl{cursor:pointer}
.r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.m{color:var(--mu);font-size:13px}
.tag{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s0{color:var(--grn)}.s1{color:var(--amb)}.s2{color:var(--red)}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.d{background:var(--red);color:#000}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:4px 0 12px}
label{font-size:13px;color:var(--mu)}
.chip{display:inline-block;padding:6px 12px;margin:3px 4px 3px 0;border:1px solid var(--bd);border-radius:99px;font-size:14px;cursor:pointer;background:var(--bg);user-select:none}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.chip b{margin-left:8px;opacity:.6;padding:0 2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:15px 0;font-size:13px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(440px,92vw);max-height:92vh;padding:18px}
dialog::backdrop{background:#000c}
dialog h2{margin:0 0 12px;font-size:18px}
.row{display:flex;gap:8px;align-items:flex-start}.row>*{flex:1}
.mt{margin-top:10px}
#pi{display:block;max-width:100%;max-height:72vh;margin:auto}[hidden]{display:none!important}
a.btn{display:block;text-align:center;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);color:var(--ac);text-decoration:none;font-weight:600}
#pd{width:min(720px,96vw)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1c1c}
.tl{position:relative;padding-left:48px;margin-top:12px}
.tl:before{content:"";position:absolute;left:19px;top:0;bottom:0;width:8px;background:#151515;border:1px solid #262626;border-width:0 1px}
.tl:after{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:repeating-linear-gradient(#777 0 8px,transparent 8px 16px)}
.mh{background:#141414;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:16px 0 4px;letter-spacing:.06em}
.ti{position:relative;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.ic{position:absolute;left:-43px;top:12px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:#2b2b2b;z-index:1}
.ic.f{background:#f59e0b}
.ic2{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#000}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .c{margin:0}
.st{display:flex;border-bottom:1px solid var(--bd);margin-bottom:10px}
.st span{flex:1;text-align:center;padding:12px 0;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--mu);cursor:pointer;text-transform:uppercase}
.st span.on{color:var(--ac);box-shadow:inset 0 -2px var(--ac)}
</style></head><body>
<header><div class="w"><div style="display:flex;gap:10px;align-items:center"><img id="av" class="av" alt="" hidden><div><select id="cs" onchange="cf('sel',this.value);render()"></select><small id="sub"></small></div></div><div><div id="odo"></div><small id="sy" style="text-align:right"></small></div></div></header>
<main class="w"><div id="v"></div></main>
<nav><button data-t="rep">Reports</button><button data-t="log">Services</button><button data-t="fuel">Fuel</button><button data-t="todo">Reminders</button><button data-t="set">More</button></nav>

<dialog id="dlg"><form id="f"><h2 id="ft"></h2>
<label for="si">Items done</label><select id="si"></select><div id="pr"></div>
<div class="row mt"><div><label for="fd" id="ld">Date</label><input id="fd" type="date"></div><div><label for="fo" id="lo">Odometer (km)</label><input id="fo" type="number" inputmode="numeric" min="0"></div></div>
<div id="wc"><label for="fe">Other costs, e.g. labour (RM)</label><input id="fe" type="number" inputmode="decimal" step="0.01" min="0" oninput="tot()"><div class="r" style="margin-bottom:12px"><b>Total</b><b id="tt"></b></div></div>
<div id="wr"><div class="row"><div><label for="rpm">Repeat every (months)</label><input id="rpm" type="number" min="0" inputmode="numeric"></div><div><label for="rpk">Repeat every (km)</label><input id="rpk" type="number" min="0" inputmode="numeric"></div></div><label for="rmd">When both a date and km are set</label><select id="rmd"><option value="or">Due at either one (whichever comes first)</option><option value="and">Due only when both are reached</option></select></div>
<div id="wp"><label for="fp">Receipt (photo or PDF)</label><input id="fp" type="file" accept="image/*,application/pdf" onchange="prev(this)"><div id="pv" class="m" style="margin-bottom:8px"></div><div class="row" style="margin-bottom:12px"><button type="button" class="g" id="vp" onclick="viewP(editId)">View saved file</button><button type="button" class="g" id="rp" onclick="rmPh=1;this.hidden=true;$('#vp').hidden=true">Remove saved file</button></div></div>
<label for="fn">Notes</label><textarea id="fn" rows="2"></textarea>
<div class="row"><button type="button" class="g" onclick="$('#dlg').close()">Cancel</button><button type="button" class="d" id="fx" onclick="del()">Delete</button><button>Save</button></div></form></dialog>

<dialog id="cd"><form id="g"><h2 id="ctt"></h2>
<label for="cn">Car name</label><input id="cn" required placeholder="e.g. Saga or Wife’s car">
<label for="cl">Car logo or picture</label><input id="cl" type="file" accept="image/*"><button type="button" class="g" id="lx" onclick="rmLg=1;this.hidden=true" style="margin-bottom:12px">Remove logo</button>
<label for="co">Current odometer (km)</label><input id="co" type="number" inputmode="numeric" min="0">
<div class="row"><div><label for="cp">Plate number</label><input id="cp"></div><div><label for="cy">Year</label><input id="cy" type="number" inputmode="numeric"></div></div>
<div class="row"><div><label for="cc">Colour</label><input id="cc"></div><div><label for="ce">Engine</label><input id="ce" placeholder="e.g. 1.3L"></div></div>
<div class="row"><div><label for="cr">Road tax expiry</label><input id="cr" type="date"></div><div><label for="ck">Fuel tank (litres)</label><input id="ck" type="number" inputmode="decimal" step="0.1" min="0" placeholder="e.g. 40"></div></div>
<label for="cm">Other details (VIN, insurance…)</label><textarea id="cm" rows="3"></textarea>
<div class="row"><button type="button" class="g" onclick="$('#cd').close()">Cancel</button><button type="button" class="d" id="cx" onclick="delC()">Delete</button><button>Save</button></div></form></dialog>

<dialog id="fu"><form id="uf"><h2 id="ut2"></h2>
<div class="row"><div><label for="ud">Date</label><input id="ud" type="date" required></div><div><label for="uo">Odometer (km)</label><input id="uo" type="number" inputmode="numeric" min="0"></div></div>
<label for="up">Place</label><input id="up" list="pl" autocomplete="off" placeholder="e.g. Petronas Kajang"><datalist id="pl"></datalist>
<label for="ut">Fuel type</label><input id="ut" list="ft2" autocomplete="off"><datalist id="ft2"><option>RON95<option>RON97<option>Diesel<option>Euro 5 Diesel</datalist>
<div class="row"><div><label for="ur">Price per litre (RM)</label><input id="ur" type="number" inputmode="decimal" step="0.001" min="0"></div><div><label for="ul">Litres</label><input id="ul" type="number" inputmode="decimal" step="0.01" min="0" required></div></div>
<label for="uc">Total cost (RM)</label><input id="uc" type="number" inputmode="decimal" step="0.01" min="0" required>
<div class="row"><button type="button" class="g" onclick="$('#fu').close()">Cancel</button><button type="button" class="d" id="ux" onclick="delU()">Delete</button><button>Save</button></div></form></dialog>
<dialog id="pd"><img id="pi" alt="Receipt"><iframe id="pf" title="PDF" hidden style="width:100%;height:68vh;border:0;border-radius:8px;background:#fff"></iframe><div id="pb" class="row mt"></div><button class="g mt" onclick="$('#pd').close()">Close</button></dialog>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={items:[],cfg:{url:'',token:'',last:''}},tab='rep',bnOpen=false,kind='log',editId=null,doneId=null,editC=null,editU=null,RF='',RT='',PR={},rmLg=0,rtab='gen',rO=0,RM='all',RY=0,sel=new Set,rmPh=0,T;
const DEF=['Engine oil and filter','Air filter','Cabin filter','Spark plugs','Brake pads','Brake fluid','Coolant','Transmission fluid','Tyres','Wheel alignment','Battery','Wiper blades','Road tax and insurance'];
const P=new Promise((r,j)=>{const q=indexedDB.open('carlog',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const kv=(m,k,v)=>P.then(d=>new Promise((r,j)=>{const s=d.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k'),q=m==='get'?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}));
const save=()=>kv('put','d',D).catch(()=>{});
async function load(){try{const v=await kv('get','d');if(v){D.items=v.items||[];D.cfg={...D.cfg,...v.cfg}}}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),
live=k=>D.items.filter(i=>i.kind===k&&!i.deleted),
S=()=>live('svc').sort((a,b)=>a.name.localeCompare(b.name)),
cars=()=>live('car'),cur=()=>cars().find(c=>c.id===D.cfg.sel)||cars()[0],
mine=k=>live(k).filter(i=>cur()&&i.carId===cur().id),
today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
rm=n=>'RM '+(+n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),
km=n=>(+n).toLocaleString('en-MY')+' km',
fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'',
odoOf=id=>Math.max(+(D.items.find(i=>i.id===id)||{}).odo||0,...D.items.filter(i=>i.carId===id&&!i.deleted&&(i.kind==='log'||i.kind==='fuel')).map(i=>+i.odo||0)),odoNow=()=>cur()?odoOf(cur().id):0,
st=t=>{t=eff(t);const{dd,dk}=dl(t),a=[dd===null?null:dd<0?2:dd<=30?1:0,dk===null?null:dk<=0?2:dk<=500?1:0].filter(x=>x!==null);return a.length?(t.mode==='and'?Math.min(...a):Math.max(...a)):0},
msg=t=>{const e=$('#msg');if(e)e.textContent=t},
cf=(k,v)=>{D.cfg[k]=v;save()},go=t=>{tab=t;render()};
function addSvc(n,seed){n=n.replace(/,/g,' ').trim();if(!n)return;const id='svc-'+(n.toLowerCase().replace(/[^a-z0-9]+/g,'-')||uid());let s=D.items.find(i=>i.id===id);
if(s&&seed)return;if(!s){s={id,kind:'svc'};D.items.push(s)}Object.assign(s,{name:n,deleted:0,updated:seed?1:Date.now()})}
const setSvc=(id,o)=>{Object.assign(D.items.find(i=>i.id===id),o,{updated:Date.now()});commit()};
function render(){
const c=D.cfg,cs=cars(),car=cur(),L=mine('log'),F=mine('fuel'),y=String(new Date().getFullYear()),sum=a=>a.reduce((s,i)=>s+(+i.cost||0),0);
$('#cs').innerHTML=cs.length?cs.map(x=>`<option value="${E(x.id)}"${x===car?' selected':''}>${E(x.name)}</option>`).join(''):'<option>Car Log</option>';
$('#sub').textContent=car?[car.plate,car.year,car.colour,car.engine,car.rtax?'Roadtax '+new Date(car.rtax+'T00:00').toLocaleString('en-GB',{month:'short',year:'numeric'}):''].filter(Boolean).join(' · '):'Add a car to begin';
$('#av').hidden=!(car&&car.logo);if(car&&car.logo)$('#av').src=car.logo;$('#odo').innerHTML=car?odoNow().toLocaleString('en-MY')+'<small>km</small>':'';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
let h='';
if(tab!=='set'&&!car)h='<p class="m">Add your first car to start logging.</p><button onclick="go(\'set\');openC()">Add a car</button>';
else if(tab==='fuel')h=safe(fuelTab);else if(tab==='rep')h=safe(reports);else if(tab==='log'){h='<button onclick="openF(\'log\')">Add service</button>'+(L.length?tl([...L].sort((a,b)=>(b.date||'').localeCompare(a.date||'')),i=>`<div class="ti" onclick="openF('log','${E(i.id)}')"><span class="ic">${E(ico((i.item||'').split(', ')[0]))}</span><div class="r"><b>${E(i.item)}</b><b>${i.cost!==''?rm(i.cost):''}</b></div>${i.odo?`<div class="m">${km(i.odo)}</div>`:''}${(i.prices&&Object.keys(i.prices).length>1)||i.other?`<div class="m">${Object.entries(i.prices||{}).map(([n,v])=>E(n)+' '+rm(v)).concat(i.other?['Other '+rm(i.other)]:[]).join(' · ')}</div>`:''}${i.notes?`<div class="m">${E(i.notes)}</div>`:''}<div class="r"><span>${i.ph?`<button class="g" style="padding:2px 10px;font-size:12px" onclick="event.stopPropagation();viewP('${E(i.id)}')">${i.pt==='pdf'?'PDF':'Receipt'}</button>`:''}</span><span class="m">${sd(i.date)}</span></div></div>`):'<p class="m">No services yet for this car.</p>')}
else if(tab==='todo'){const U=rem().sort((a,b)=>st(b)-st(a)||(a.date||'9').localeCompare(b.date||'9'));
h='<button onclick="openF(\'todo\')">Add reminder</button>'+(U.length?U.map(remCard).join(''):'<p class="m">Nothing coming up. Add a reminder, or set your road tax expiry in the car details.</p>')}
else if(tab==='cars')h='<button onclick="openC()">Add car</button>'+cs.map(x=>`<div class="c cl" onclick="openC('${E(x.id)}')"><b>${E(x.name)}</b><div class="m">${E([x.plate,x.year,x.colour,x.engine].filter(Boolean).join(' · '))}</div>${x.notes?`<div class="m">${E(x.notes)}</div>`:''}</div>`).join('');
else h=`<div class="c"><b>Your cars</b><br><button class="g mt" onclick="openC()">Add car</button>${cs.map(x=>`<div class="c cl" onclick="openC('${E(x.id)}')"><b>${E(x.name)}</b><div class="m">${E([x.plate,x.year,x.colour,x.engine].filter(Boolean).join(' · '))}</div></div>`).join('')}</div><div class="c"><b>Service items</b><select id="ss">${S().map(s=>`<option value="${E(s.id)}">${E((s.icon||'')+' '+s.name)}</option>`).join('')}</select>
<div class="row"><button class="g" onclick="renSvc()">Rename</button><button class="g" onclick="delSvc()">Remove</button><button class="g" onclick="icSvc()">Icon</button></div>
<div class="row mt"><input id="ns" placeholder="New item, e.g. Rustproofing" style="margin:0"><button onclick="addSvc($('#ns').value);commit()">Add</button></div><p class="m">Old entries keep their text when you rename or remove an item.</p></div>
<div class="c"><b>Google Sheets sync</b><br><label>Web app URL</label><input value="${E(c.url)}" placeholder="https://script.google.com/macros/s/…/exec" onchange="cf('url',this.value.trim())">
<label>Secret token (same as in Code.gs)</label><input type="password" value="${E(c.token)}" onchange="cf('token',this.value.trim())">
<label class="m" style="display:flex;gap:8px;align-items:center;margin:4px 0 12px"><input type="checkbox" style="width:auto;margin:0" ${c.cal?'checked':''} onchange="cf('cal',this.checked);sync(1)"> Add reminders to Google Calendar</label><button onclick="sync(1)">Sync now</button><p class="m" id="msg">${E(c.last?'Last synced '+c.last:'Not synced yet')}</p><p class="m">Receipt photos stay on the device that took them. Use Export JSON to carry them across.</p></div>
<div class="c"><b>Backup file</b><p class="m">Saves everything, including receipt photos. Keep a copy in iCloud Drive, Google Drive or OneDrive.</p>
<div class="row"><button class="g" onclick="exp()">Export JSON</button><button class="g" onclick="$('#imp').click()">Import JSON</button></div>
<input id="imp" type="file" accept=".json,application/json" hidden onchange="imp(this)"></div>`;
const due=rem().filter(t=>st(t)>0);$('#v').innerHTML=(due.length&&tab!=='todo'&&tab!=='set'&&tab!=='rep'?`<div class="c s${Math.max(...due.map(st))}"><div class="r cl" onclick="bnOpen=!bnOpen;render()"><b>${due.length} reminder${due.length>1?'s need':' needs'} attention</b><span class="m">${bnOpen?'Hide ▴':'Show ▾'}</span></div>${bnOpen?due.map(i=>mini(i)).join(''):''}</div>`:'')+h}
$('#v').onclick=e=>{const t=e.target,x=t.dataset.x,ch=t.closest('.chip');
if(x){if(confirm('Remove this item from your list?'))setSvc(x,{deleted:1})}
else if(ch&&ch.dataset.id){const s=D.items.find(i=>i.id===ch.dataset.id),n=prompt('Rename item',s.name);if(n&&n.trim())setSvc(s.id,{name:n.replace(/,/g,' ').trim()})}};
function chips(){$('#si').innerHTML='<option value="">Add an item…</option>'+S().map(x=>x.name).filter(n=>!sel.has(n)).map(n=>`<option>${E(n)}</option>`).join('')+'<option value="+">New item…</option>'}
$('#si').onchange=e=>{let v=e.target.value;if(v==='+'){v=(prompt('New item name')||'').replace(/,/g,' ').trim();if(v){addSvc(v);save()}else v=''}if(v){sel.add(v);prices()}chips()};
function renSvc(){const x=D.items.find(i=>i.id===$('#ss').value);if(!x)return;const n=prompt('Rename item',x.name);if(n&&n.trim())setSvc(x.id,{name:n.replace(/,/g,' ').trim()})}
function delSvc(){const x=D.items.find(i=>i.id===$('#ss').value);if(x&&confirm('Remove "'+x.name+'" from your list?'))setSvc(x.id,{deleted:1})}
function openF(k,id,pre){kind=k;editId=id||null;doneId=pre?pre.id:null;rmPh=0;
const L=k==='log',it=id?D.items.find(i=>i.id===id):pre?{item:pre.item,date:today(),odo:odoNow()||'',notes:pre.notes}:L?{date:today(),odo:odoNow()||''}:{};
sel=new Set((it.item||'').split(', ').filter(Boolean));chips();
$('#ft').textContent=(id?'Edit ':'Add ')+(L?'service':'reminder');$('#ld').textContent=L?'Date':'Due date';$('#lo').textContent=L?'Odometer (km)':'Due at (km)';
$('#wc').hidden=$('#wp').hidden=!L;$('#wr').hidden=L;$('#rpm').value=it.rpm||'';$('#rpk').value=it.rpk||'';$('#rmd').value=it.mode||'or';$('#rp').hidden=!it.ph;$('#vp').hidden=!(it.ph&&id);$('#pv').innerHTML='';$('#fp').value='';$('#fd').required=L;$('#fx').hidden=!id;
$('#fd').value=it.date||'';$('#fo').value=it.odo||'';$('#fe').value=it.prices?(it.other||''):(it.cost||'');PR={...(it.prices||{})};prices();$('#fn').value=it.notes||'';$('#dlg').showModal()}
const done=id=>openF('log',null,D.items.find(i=>i.id===id));
const shrink=(f,m=1200,t='image/jpeg')=>new Promise((r,j)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL(t,.8))};i.onerror=j;i.src=u});
